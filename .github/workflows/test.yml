name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: colab_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CKAN 2.10 and the integration dependencies used by the deployed portal.
      CKAN_IMAGE: pabrojast/ckan-base210:home-loading-prod-20261023-r1@sha256:3c79c1d7e8396114dd0d93da18253144ae48c3c7bf8797818af51080ecddd97c
      COLAB_ACCOUNT_TEST_DB: postgresql://postgres:postgres@127.0.0.1:5432/colab_test
    steps:
      # Run JavaScript actions on the host, outside the legacy Alpine runtime.
      - uses: actions/checkout@v4
      - name: Test Colab with CKAN and an isolated PostgreSQL database
        run: |
          docker run --rm --network host --user root \
            -v "$GITHUB_WORKSPACE:/app/src/ckanext-colab" \
            -e COLAB_ACCOUNT_TEST_DB -e PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            "$CKAN_IMAGE" sh -c '
              set -eu
              pip install pytest pytest-cov
              python /app/src/ckanext-colab/ckanext/colab/tests/bootstrap_accounts.py
              python -m pytest -q /app/src/ckanext-colab/ckanext/colab/tests --tb=short
            '
